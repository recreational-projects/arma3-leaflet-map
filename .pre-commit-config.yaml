repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-ast
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [ --fix=no ]
  - id: trailing-whitespace
  - id: name-tests-test
    args: [ --pytest-test-first ]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.20
  hooks:
  - id: ruff-check
    name: ruff (lint)
    args: [ --fix ]
  - id: ruff-format
    name: ruff (format)

- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 1.1.1  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
      language: system  # Use system-installed pyrefly
